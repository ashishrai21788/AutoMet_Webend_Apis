name: Backend CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The suite uses in-memory MongoDB / PGlite, so no secrets or external services are needed.
      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-only-secret
